[package]
name = "celetixo-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Authenticated NATS JetStream delivery of durable Engine lifecycle notifications"

[dependencies]
celetixo-engine = { path = "../engine" }
celetixo-postgres = { path = "../postgres" }
celetixo-protocol = { path = "../protocol" }
async-nats = { version = "=0.52.0", default-features = false, features = ["jetstream", "ring", "nuid", "server_2_14"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
prost.workspace = true
tempfile.workspace = true

[lints]
workspace = true
