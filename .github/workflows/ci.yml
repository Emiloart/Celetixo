name: Rust engine and repository intelligence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    name: Commit attribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check GitHub Actions workflow semantics
        run: python3 .github/scripts/check-workflows.py
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$(git rev-list --max-count=1 HEAD)"
          else
            range="$BEFORE_SHA..$HEAD_SHA"
          fi
          bash .github/scripts/check-commit-attribution.sh "$range"
      - name: Test attribution enforcement
        run: bash .github/scripts/test-commit-attribution.sh

  protocol:
    name: Canonical TaskIntent and reproducible bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt
      - name: Verify schema integrity, ADR preservation and compatibility mutations
        run: |
          python3 scripts/protocol/check.py
          python3 -O scripts/protocol/test_compatibility.py
      - name: Compare the published base descriptor when present
        env:
          PROTOCOL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$PROTOCOL_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$PROTOCOL_BASE_SHA:proto/descriptor.bin" 2>/dev/null; then
            python3 scripts/protocol/check.py --against-ref "$PROTOCOL_BASE_SHA"
          fi
      - name: Fetch locked generator dependencies
        run: cargo fetch --manifest-path scripts/protocol/generator/Cargo.toml --locked
      - name: Reproduce bindings, descriptor and golden wire with pinned protoc
        run: python3 scripts/protocol/regenerate.py --check
      - name: Test strict Rust intake
        run: cargo test --locked -p celetixo-protocol

  temporal-foundation:
    name: Real scoped Temporal bootstrap and workflow recovery
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Provision the exact Go compiler and canonical generator
        run: |
          python3 scripts/protocol/provision_go.py --cache-dir "$RUNNER_TEMP/celetixo-tools"
          python3 scripts/protocol/provision.py --cache-dir "$RUNNER_TEMP/celetixo-tools"
      - name: Verify module content, canonical Go bindings and all Go packages
        working-directory: services/orchestration
        run: |
          celetixo_go="$RUNNER_TEMP/celetixo-tools/go1.26.11/go/bin/go"
          "$celetixo_go" mod download
          "$celetixo_go" mod verify
          python3 ../../scripts/protocol/regenerate_go.py --offline --cache-dir "$RUNNER_TEMP/celetixo-tools" --check
          test -z "$("$RUNNER_TEMP/celetixo-tools/go1.26.11/go/bin/gofmt" -l .)"
          "$celetixo_go" test -trimpath -buildvcs=false -mod=readonly ./...
          "$celetixo_go" vet -trimpath -buildvcs=false -mod=readonly ./...
          "$celetixo_go" build -trimpath -buildvcs=false -mod=readonly -o "$RUNNER_TEMP/celetixo-temporal" ./cmd/celetixo-temporal
          "$celetixo_go" build -trimpath -buildvcs=false -mod=readonly -o "$RUNNER_TEMP/celetixo-temporal-probe" ./cmd/celetixo-temporal-probe
      - name: Prepare the isolated Temporal database and service fixture
        run: |
          docker pull postgres@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
          python3 scripts/goal04/temporal_fixture.py prepare --root "$RUNNER_TEMP/celetixo-temporal-fixture" --binary "$RUNNER_TEMP/celetixo-temporal" --probe "$RUNNER_TEMP/celetixo-temporal-probe"
          python3 scripts/goal04/temporal_fixture.py start --root "$RUNNER_TEMP/celetixo-temporal-fixture"
          python3 scripts/goal04/temporal_fixture.py verify --root "$RUNNER_TEMP/celetixo-temporal-fixture"
      - name: Recover the original synthetic workflow run after worker and service restart
        run: python3 scripts/goal04/temporal_workflow_smoke.py --root "$RUNNER_TEMP/celetixo-temporal-fixture"
      - name: Stop only the owned fixture and retain its data
        if: always()
        run: python3 scripts/goal04/temporal_fixture.py stop --root "$RUNNER_TEMP/celetixo-temporal-fixture"

  postgres-foundation:
    name: Real PostgreSQL migration, restart and isolation
    runs-on: ubuntu-latest
    # The retained local full SQL regression took about 80 minutes.
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Cache the reviewed PostgreSQL image explicitly
        run: docker pull postgres@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
      - name: Start and verify private SCRAM-authenticated Unix-socket fixture
        run: |
          python3 scripts/goal04/postgres_fixture.py start --root "$RUNNER_TEMP/celetixo-pg17"
          python3 scripts/goal04/postgres_fixture.py verify --root "$RUNNER_TEMP/celetixo-pg17"
          python3 scripts/goal04/postgres_fixture.py prepare-events --root "$RUNNER_TEMP/celetixo-pg17"
      - name: Provision and verify the pinned three-node mutual-TLS event fixture
        run: |
          python3 scripts/goal04/nats_fixture.py provision-tools --root "$RUNNER_TEMP/celetixo-nats" --tools "$RUNNER_TEMP/celetixo-nats-tools"
          python3 scripts/goal04/nats_fixture.py start --root "$RUNNER_TEMP/celetixo-nats" --tools "$RUNNER_TEMP/celetixo-nats-tools"
          python3 scripts/goal04/nats_fixture.py verify --root "$RUNNER_TEMP/celetixo-nats" --tools "$RUNNER_TEMP/celetixo-nats-tools"
      - name: Test the real database, including process death and actual database restart
        run: CELETIXO_PG_TEST_CONFIG="$RUNNER_TEMP/celetixo-pg17/connection-events.json" CELETIXO_NATS_TEST_CONFIG="$RUNNER_TEMP/celetixo-nats/connection.json" cargo --config 'profile.test.package.celetixo-postgres.opt-level=0' test --locked -p celetixo-postgres --test foundation -- --ignored --skip migration_crash_child --skip source_authority::recovery::source_process_child --skip source_authority::lifecycle::mutations::executor::executor_replay_child --skip source_authority::lifecycle::revalidation::source_revalidation_process_child --skip source_authority::lifecycle::publication::processes::source_commit_process_child --skip event_process_checkpoint --test-threads=1
      - name: Stop the owned event fixture and preserve its data
        if: always()
        run: python3 scripts/goal04/nats_fixture.py stop --root "$RUNNER_TEMP/celetixo-nats" --tools "$RUNNER_TEMP/celetixo-nats-tools"
      - name: Stop this fixture
        if: always()
        run: python3 scripts/goal04/postgres_fixture.py stop --root "$RUNNER_TEMP/celetixo-pg17"

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --component rust-analyzer
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test engine, repository intelligence and reference histories
        run: cargo test --workspace --locked
      - name: Probe actual rust-analyzer on a trusted fixture
        run: cargo test --locked -p celetixo-repository --test lsp real_rust_analyzer_definition_and_references -- --ignored --exact
      - name: Build workspace
        run: cargo build --workspace --examples --locked
      - name: Run concurrent transaction example
        run: cargo run --locked -p celetixo-engine --example concurrent_transactions
      - name: Check benchmark reporting rejects invalid measurements
        run: python3 .github/scripts/test-goal03-benchmark-summary.py
      - name: Inspect exact repository tree through the Engine
        run: >-
          cargo run --locked -p celetixo-repository --example inspect_repository -- . --git-tree "$(git rev-parse HEAD)" --changed crates/engine/src/engine.rs
          --reviewed-public-input crates/engine/src/engine.rs=3f2194fee88336255c212fb7166b5d3fe33ebaee9269181555b18ec1f6c6df75
          --reviewed-public-input crates/engine/src/engine/authority/records.rs=12e5c2af32fdccd19e0afd96ca73f7b7f222f71dbf6a05d5a2c88cedf5c2b546
          --reviewed-public-input crates/engine/src/engine/source_recovery.rs=1552093e377c74023caa1aaf702a116758b81d203735c074e62b4d26a98f658d
          --reviewed-public-input crates/postgres/src/lib.rs=d2b103ff13583a1ffebac35aeeb48dae1804fe5b803f446b81fcc0bc87eb5d09
          --reviewed-public-input docs/implementation/goal-04-registration-validation/fixture.json=7af849f6ea540693cdecf457975ba468b550ae60a3d728a520a17504c9941d92
          --reviewed-public-input docs/implementation/goal-04-foundation/followup.log=4795cb329924987a0270bd0f27b6595b805f7c8c704cb000e6d586d26a2931ce
          --reviewed-public-input docs/implementation/goal-04-foundation/image-selection.json=6afd19611e1f7b7dfddd98aceadf986af0449e47732de1b7e3401423cf070067
          --reviewed-public-input scripts/goal04/postgres_fixture.py=306678b400cefdcb2e0cf831c45b9e239dec6a56e1c7ab8d7b941cb1d5005be6
          --reviewed-public-input scripts/goal04/temporal_fixture.py=d2252a7c515898b0bfe651ec637c1e9c9fca4a393d00b4d99a583541fee9d08b
          --reviewed-public-input crates/postgres/tests/foundation/native_authority/events/nats.rs=322feb46fca6898da8a04db504b0812b532774b061888601a52844fcf84232ab
          --reviewed-public-input docs/implementation/goal-04-events-validation/postgres-final-verify.json=09af2bfadbe231f43a44ede68ffbdda9327f8e7c7207a221af89827207d7e4c6
          --reviewed-public-input docs/operations/local-event-delivery-runbook.md=baa50cb259dcc46db630631457a5951bf277aa6d1be26d05aad914526fec6489 > /tmp/goal02-inspection.json
      - name: Check reproducible benchmark harness
        run: cargo run --locked -p celetixo-repository --example repository_bench -- --copies 1 --iterations 1 --queries 3 > /tmp/goal02-benchmark-smoke.json
      - name: Check source patch measurement runner on this immutable tree
        run: >-
          cargo run --locked -p celetixo-execution --example source_patch_bench -- . "$(git rev-parse HEAD)" --iterations 1
          --reviewed-public-input crates/engine/src/engine.rs=3f2194fee88336255c212fb7166b5d3fe33ebaee9269181555b18ec1f6c6df75
          --reviewed-public-input crates/engine/src/engine/authority/records.rs=12e5c2af32fdccd19e0afd96ca73f7b7f222f71dbf6a05d5a2c88cedf5c2b546
          --reviewed-public-input crates/engine/src/engine/source_recovery.rs=1552093e377c74023caa1aaf702a116758b81d203735c074e62b4d26a98f658d
          --reviewed-public-input crates/postgres/src/lib.rs=d2b103ff13583a1ffebac35aeeb48dae1804fe5b803f446b81fcc0bc87eb5d09
          --reviewed-public-input docs/implementation/goal-04-registration-validation/fixture.json=7af849f6ea540693cdecf457975ba468b550ae60a3d728a520a17504c9941d92
          --reviewed-public-input docs/implementation/goal-04-foundation/followup.log=4795cb329924987a0270bd0f27b6595b805f7c8c704cb000e6d586d26a2931ce
          --reviewed-public-input docs/implementation/goal-04-foundation/image-selection.json=6afd19611e1f7b7dfddd98aceadf986af0449e47732de1b7e3401423cf070067
          --reviewed-public-input scripts/goal04/postgres_fixture.py=306678b400cefdcb2e0cf831c45b9e239dec6a56e1c7ab8d7b941cb1d5005be6
          --reviewed-public-input scripts/goal04/temporal_fixture.py=d2252a7c515898b0bfe651ec637c1e9c9fca4a393d00b4d99a583541fee9d08b
          --reviewed-public-input crates/postgres/tests/foundation/native_authority/events/nats.rs=322feb46fca6898da8a04db504b0812b532774b061888601a52844fcf84232ab
