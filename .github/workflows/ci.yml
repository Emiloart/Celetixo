name: Rust engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    name: Commit attribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$(git rev-list --max-count=1 HEAD)"
          else
            range="$BEFORE_SHA..$HEAD_SHA"
          fi
          bash .github/scripts/check-commit-attribution.sh "$range"

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test engine and reference histories
        run: cargo test --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Run concurrent transaction example
        run: cargo run --locked -p celetixo-engine --example concurrent_transactions
